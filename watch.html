<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonton Replay JKT48</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark')
    } else {
      document.documentElement.classList.add('dark')
    }
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-white dark:bg-black text-black dark:text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header Navigasi -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-black/90 backdrop-blur border-b border-gray-200 dark:border-[#222] px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <!-- Logo Style REPLAY JKT48 -->
      <a href="index.html" class="flex items-center">
        <span class="bg-[#a88a55] text-black font-bold px-2 py-0.5 rounded text-sm tracking-wider">REPLAY</span>
        <span class="text-black dark:text-white font-bold text-lg ml-2 tracking-wide">JKT48</span>
      </a>
      
      <!-- Tombol Tema Transparan -->
      <button onclick="toggleTheme()" class="bg-transparent p-2 text-xl hover:opacity-80 transition-opacity">
        <span class="dark:hidden">🌙</span>
        <span class="hidden dark:inline">☀️</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto w-full p-0 sm:p-4 lg:p-6 pb-10">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Kolom Kiri -->
      <div class="lg:col-span-2 space-y-3">
        <!-- Player -->
        <div class="bg-black w-full relative sm:rounded-2xl overflow-hidden shadow-lg aspect-video">
          <iframe id="doodPlayer" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
        </div>

        <!-- Info -->
        <div onclick="openModal('descModal')" class="cursor-pointer px-4 sm:px-1 py-2 hover:bg-gray-50 dark:hover:bg-[#111] sm:hover:bg-transparent rounded-xl transition-colors">
          <h1 id="videoTitle" class="text-base sm:text-lg font-bold leading-tight line-clamp-2">Memuat...</h1>
          <div class="flex justify-between items-center mt-1.5 text-xs text-gray-500 dark:text-gray-400">
            <span id="videoMeta">Memuat data...</span>
          </div>
        </div>

        <!-- Komentar Trigger -->
        <div onclick="openModal('commentModal')" class="mx-4 sm:mx-0 px-4 py-3 bg-gray-100 dark:bg-[#181818] rounded-2xl cursor-pointer hover:bg-gray-200 dark:hover:bg-[#222] transition-colors">
          <div class="text-xs font-bold mb-2 text-gray-900 dark:text-gray-100">Komentar</div>
          <div class="flex items-center gap-3 bg-gray-200/60 dark:bg-[#282828] px-3 py-2 rounded-full">
            <div class="w-5 h-5 rounded-full bg-gray-400 dark:bg-gray-600 flex-shrink-0 flex items-center justify-center text-[10px] text-white">👤</div>
            <span id="previewCommentText" class="text-xs text-gray-500 dark:text-gray-400 truncate">Komentar...</span>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="px-4 sm:px-0 lg:col-span-1">
        <h2 class="text-sm font-bold mb-3">Rekomendasi</h2>
        <div id="recommendationsList" class="flex flex-col gap-3"></div>
      </div>
    </div>
  </main>

  <!-- Modal Deskripsi -->
  <div id="descModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60" onclick="closeModal('descModal')"></div>
    <div class="absolute bottom-0 sm:bottom-auto sm:top-1/2 sm:-translate-y-1/2 sm:left-1/2 sm:-translate-x-1/2 w-full sm:max-w-lg h-[80vh] sm:h-auto bg-white dark:bg-[#0f0f0f] rounded-t-2xl sm:rounded-2xl p-4 overflow-y-auto">
      <div class="w-12 h-1 bg-gray-400 dark:bg-gray-600 rounded-full mx-auto mb-4 sm:hidden"></div>
      <h2 class="text-lg font-bold mb-4">Deskripsi</h2>
      <p id="videoDescription" class="text-sm text-gray-700 dark:text-gray-300"></p>
    </div>
  </div>

  <!-- Modal Komentar -->
  <div id="commentModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60" onclick="closeModal('commentModal')"></div>
    <div class="absolute bottom-0 sm:bottom-auto sm:top-1/2 sm:-translate-y-1/2 sm:left-1/2 sm:-translate-x-1/2 w-full sm:max-w-lg h-[85vh] sm:h-[650px] bg-white dark:bg-[#0f0f0f] rounded-t-2xl sm:rounded-2xl flex flex-col">
      <div class="px-4 py-3 border-b border-gray-200 dark:border-[#222] flex justify-between items-center">
        <h2 class="font-bold text-base">Komentar</h2>
        <button onclick="closeModal('commentModal')" class="text-xl p-1">✕</button>
      </div>
      <div id="commentsList" class="flex-grow overflow-y-auto p-4"></div>
      <form id="commentForm" onsubmit="submitComment(event)" class="p-3 border-t border-gray-200 dark:border-[#222] flex flex-col gap-2">
        <input type="text" id="commentNickname" placeholder="Nama" class="bg-gray-100 dark:bg-[#1a1a1a] rounded-lg px-3 py-1.5 text-xs outline-none">
        <div class="flex gap-2">
          <input type="text" id="commentContent" placeholder="Komentar..." class="flex-grow bg-gray-100 dark:bg-[#1a1a1a] rounded-full px-4 py-2 text-xs outline-none">
          <button type="submit" id="submitBtn" class="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold">Kirim</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const CUSDIS_APP_ID = "3b6b52be-1199-4fa2-bfb6-079f492bebe9";
    const urlParams = new URLSearchParams(window.location.search);
    const currentCode = urlParams.get('code');
    
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.remove('hidden'); }
    
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }

    async function init() {
      const res = await fetch('data.json');
      const videos = await res.json();
      const currentVideo = videos.find(v => v.dood_code === currentCode);
      
      if(currentVideo) {
        document.getElementById('videoTitle').innerText = currentVideo.title;
        document.getElementById('doodPlayer').src = `https://dood.so/e/${currentVideo.dood_code}`;
        document.getElementById('videoDescription').innerText = currentVideo.description || "Tidak ada deskripsi.";
        
        // Render Rekomendasi
        const recList = document.getElementById('recommendationsList');
        recList.innerHTML = '';
        videos.filter(v => v.dood_code !== currentCode).slice(0, 6).forEach(v => {
          recList.innerHTML += `
            <a href="watch.html?code=${v.dood_code}" class="flex gap-3 items-start p-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#111]">
              <img src="${v.thumb}" class="w-32 aspect-video rounded-lg object-cover">
              <div class="flex flex-col text-xs">
                <h3 class="font-semibold line-clamp-2">${v.title}</h3>
              </div>
            </a>
          `;
        });
      }
      fetchComments();
    }

    async function fetchComments() {
      if(!currentCode) return;
      try {
        const res = await fetch(`https://cusdis.com/api/open/comments?appId=${CUSDIS_APP_ID}&pageId=${currentCode}`);
        const data = await res.json();
        const listEl = document.getElementById('commentsList');
        const previewEl = document.getElementById('previewCommentText');
        
        if(data.data.list.length > 0) {
          previewEl.innerText = `${data.data.list[0].nickname}: ${data.data.list[0].content}`;
          listEl.innerHTML = data.data.list.map(c => `
            <div class="mb-4">
              <div class="font-bold text-xs">${c.nickname}</div>
              <div class="text-sm">${c.content}</div>
            </div>
          `).join('');
        }
      } catch(e) {}
    }

    async function submitComment(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Mengirim...';
      try {
        await fetch('https://cusdis.com/api/open/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            appId: CUSDIS_APP_ID, 
            pageId: currentCode,
            nickname: document.getElementById('commentNickname').value || 'Anonim',
            content: document.getElementById('commentContent').value
          })
        });
        document.getElementById('commentContent').value = '';
        fetchComments();
      } catch(err) { alert("Gagal"); }
      btn.innerText = 'Kirim';
    }

    init();
  </script>
</body>
</html>
