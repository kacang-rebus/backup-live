<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonton Replay JKT48</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Konfigurasi Dark Mode Tailwind -->
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Skrip Inisialisasi Tema (Membaca LocalStorage saat halaman pertama dimuat) -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    .sheet-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .hidden-sheet { transform: translateY(100%); }
    .show-sheet { transform: translateY(0); }
  </style>
</head>
<body class="bg-white dark:bg-black text-black dark:text-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-black/90 backdrop-blur border-b border-gray-200 dark:border-[#222] px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center">
        <span class="bg-[#a88a55] text-black font-bold px-2 py-0.5 rounded text-sm tracking-wider">REPLAY</span>
        <span class="text-black dark:text-white font-bold text-lg ml-2 tracking-wide">JKT48</span>
      </a>
      <!-- Tombol Switcher Mode Gelap / Terang -->
      <button onclick="toggleTheme()" class="bg-transparent p-2 text-xl hover:opacity-80 transition-opacity">
        <span class="dark:hidden">🌙</span>
        <span class="hidden dark:inline">☀️</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout (Grid 2 Kolom Aktif Mulai Ukuran md / 768px) -->
  <main class="max-w-6xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- Kolom Kiri: Player & Info Video -->
    <div class="md:col-span-2 space-y-4">
      <div class="bg-black w-full aspect-video rounded-xl overflow-hidden shadow-lg">
        <iframe id="doodPlayer" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
      </div>

      <!-- Info Video / Pemicu Deskripsi -->
      <div onclick="openModal('descModal')" class="cursor-pointer p-3 hover:bg-gray-100 dark:hover:bg-[#111] rounded-xl transition-colors">
        <h1 id="videoTitle" class="text-base font-bold leading-tight">Memuat...</h1>
        <div id="videoMeta" class="text-xs text-gray-500 dark:text-gray-400 mt-1">Memuat data...</div>
      </div>

      <!-- Pemicu Modal Komentar -->
      <div onclick="openModal('commentModal')" class="p-3 bg-gray-100 dark:bg-[#181818] rounded-xl cursor-pointer hover:bg-gray-200 dark:hover:bg-[#222] transition-colors">
        <div class="text-xs font-bold mb-1">Komentar</div>
        <div id="previewCommentText" class="text-xs text-gray-500">Klik untuk melihat atau menulis komentar...</div>
      </div>
    </div>

    <!-- Kolom Kanan: Rekomendasi Video -->
    <div class="md:col-span-1 mt-2 md:mt-0">
      <h2 class="text-sm font-bold mb-3">Rekomendasi</h2>
      <div id="recommendationsList" class="flex flex-col gap-3"></div>
    </div>
  </main>

  <!-- Modal Deskripsi (Bottom Sheet) -->
  <div id="descModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60" onclick="history.back()"></div>
    <div class="sheet-transition hidden-sheet absolute bottom-0 w-full h-[85vh] bg-white dark:bg-[#0f0f0f] rounded-t-2xl p-6 overflow-y-auto">
      <button onclick="history.back()" class="absolute top-4 right-4 text-xl font-bold">✕</button>
      <h2 class="text-lg font-bold mb-4">Deskripsi</h2>
      
      <!-- Ringkasan Statistik -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-gray-100 dark:bg-[#1a1a1a] p-4 rounded-xl text-center">
          <div id="statViews" class="font-bold text-lg">0</div>
          <div class="text-[10px] text-gray-500">Ditonton</div>
        </div>
        <div class="bg-gray-100 dark:bg-[#1a1a1a] p-4 rounded-xl text-center">
          <div id="statDate" class="font-bold text-lg">-</div>
          <div class="text-[10px] text-gray-500">Tanggal</div>
        </div>
      </div>
      
      <p id="videoDescription" class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed"></p>
    </div>
  </div>

  <!-- Modal Komentar (Bottom Sheet) -->
  <div id="commentModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60" onclick="history.back()"></div>
    <div class="sheet-transition hidden-sheet absolute bottom-0 w-full h-[85vh] bg-white dark:bg-[#0f0f0f] rounded-t-2xl flex flex-col overflow-hidden">
      <div class="px-6 py-3 border-b border-gray-200 dark:border-[#222] flex justify-between items-center">
        <h2 class="font-bold text-base">Komentar</h2>
        <button onclick="history.back()" class="text-xl">✕</button>
      </div>

      <!-- Daftar Komentar (Warna Kartu Berselang-seling) -->
      <div id="commentsList" class="flex-grow overflow-y-auto p-4 space-y-3"></div>

      <!-- Form Komentar -->
      <form id="commentForm" onsubmit="submitComment(event)" class="p-3 border-t border-gray-200 dark:border-[#222] flex items-center gap-2 bg-white dark:bg-[#0f0f0f]">
        <div class="w-8 h-8 rounded-full bg-gray-300 dark:bg-[#333] flex items-center justify-center text-xs flex-shrink-0">
          👤
        </div>
        <div class="flex-grow">
          <input type="text" id="commentContent" placeholder="Komentar..." required class="w-full bg-gray-100 dark:bg-[#222] text-black dark:text-white rounded-full px-4 py-2 text-xs outline-none">
        </div>
        <button type="submit" id="submitBtn" class="w-9 h-9 rounded-full bg-gray-200 dark:bg-[#2d2d2d] hover:bg-gray-300 dark:hover:bg-[#3d3d3d] flex items-center justify-center flex-shrink-0 transition-colors">
          <svg class="w-4 h-4 text-gray-700 dark:text-gray-200 transform rotate-45 -translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    const CUSDIS_APP_ID = "3b6b52be-1199-4fa2-bfb6-079f492bebe9";
    const urlParams = new URLSearchParams(window.location.search);
    const currentCode = urlParams.get('code');
    let activeModal = null;

    window.onpopstate = () => { closeModal(); };

    function openModal(id) {
      activeModal = document.getElementById(id);
      activeModal.classList.remove('hidden');
      setTimeout(() => { activeModal.querySelector('.sheet-transition').classList.add('show-sheet'); }, 10);
      window.history.pushState({modal: id}, '');
    }

    function closeModal() {
      if (!activeModal) return;
      activeModal.querySelector('.sheet-transition').classList.remove('show-sheet');
      setTimeout(() => { activeModal.classList.add('hidden'); activeModal = null; }, 300);
    }

    // Fungsi Pengalih Tema Gelap/Terang
    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    }

    async function init() {
      try {
        const res = await fetch('data.json');
        const videos = await res.json();
        const currentVideo = videos.find(v => v.dood_code === currentCode);
        
        if(currentVideo) {
          document.getElementById('videoTitle').innerText = currentVideo.title;
          document.getElementById('doodPlayer').src = `https://dood.so/e/${currentVideo.dood_code}`;
          document.getElementById('videoDescription').innerText = currentVideo.description || "Tidak ada deskripsi.";
          
          // Memastikan Tahun Ditampilkan Lengkap
          const fullDate = currentVideo.date || `${currentVideo.day || ''} ${currentVideo.month || ''} ${currentVideo.year || ''}`.trim();
          document.getElementById('statDate').innerText = fullDate || "-";

          // Fetch Views
          fetch(`https://api.countapi.xyz/hit/replay_jkt48_catalog_v1/${currentCode}`)
            .then(r => r.json())
            .then(d => {
              const v = (d.value || 0).toLocaleString();
              document.getElementById('videoMeta').innerText = `${v} x ditonton`;
              document.getElementById('statViews').innerText = v;
            }).catch(() => {
              document.getElementById('videoMeta').innerText = "Belum ada penayangan";
            });

          // Render Rekomendasi Video
          const recList = document.getElementById('recommendationsList');
          recList.innerHTML = '';
          videos.filter(v => v.dood_code !== currentCode).slice(0, 8).forEach(v => {
            const recDate = v.date || `${v.day || ''} ${v.month || ''} ${v.year || ''}`.trim();
            recList.innerHTML += `
              <a href="watch.html?code=${v.dood_code}" class="flex gap-3 hover:bg-gray-100 dark:hover:bg-[#111] p-2 rounded-xl transition-colors">
                <img src="${v.thumb}" class="w-28 aspect-video rounded-lg object-cover bg-gray-800 flex-shrink-0">
                <div class="flex flex-col justify-center min-w-0">
                  <h3 class="text-xs font-semibold line-clamp-2 leading-snug">${v.title}</h3>
                  <p class="text-[10px] text-gray-500 mt-1">${recDate}</p>
                </div>
              </a>
            `;
          });
        }
      } catch(e) {
        console.error(e);
      }
      fetchComments();
    }

    async function fetchComments() {
      if(!currentCode) return;
      try {
        const res = await fetch(`https://cusdis.com/api/open/comments?appId=${CUSDIS_APP_ID}&pageId=${currentCode}`);
        const data = await res.json();
        const list = document.getElementById('commentsList');
        
        if(data.data.list.length > 0) {
          document.getElementById('previewCommentText').innerText = `${data.data.list[0].nickname}: ${data.data.list[0].content}`;
          list.innerHTML = data.data.list.map((c, i) => `
            <div class="p-3 rounded-xl ${i % 2 === 0 ? 'bg-gray-100 dark:bg-[#1a1a1a]' : 'bg-gray-200/70 dark:bg-[#222]'}">
              <div class="font-bold text-[11px] opacity-80 mb-0.5">${c.nickname}</div>
              <div class="text-xs leading-relaxed">${c.content}</div>
            </div>
          `).join('');
        } else {
          list.innerHTML = '<div class="text-xs text-center text-gray-500 py-8">Belum ada komentar.</div>';
        }
      } catch(e) {}
    }

    async function submitComment(e) {
      e.preventDefault();
      const input = document.getElementById('commentContent');
      const text = input.value.trim();
      if(!text || !currentCode) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      try {
        const res = await fetch('https://cusdis.com/api/open/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            appId: CUSDIS_APP_ID,
            pageId: currentCode,
            nickname: 'Penggemar',
            content: text
          })
        });

        if(res.ok) {
          input.value = '';
          fetchComments();
        }
      } catch(e) {
        alert("Gagal mengirim komentar.");
      } finally {
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
