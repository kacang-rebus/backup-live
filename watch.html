<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonton Replay JKT48</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark')
    } else {
      document.documentElement.classList.add('dark')
    }
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-white dark:bg-black text-black dark:text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Player Area -->
  <div class="sticky top-0 z-40 bg-black w-full" style="padding-top: 56.25%;">
    <iframe id="doodPlayer" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
  </div>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto pb-10">
    
    <!-- Title & Views Area (Trigger Desc Modal) -->
    <div onclick="openModal('descModal')" class="cursor-pointer px-4 pt-4 pb-2">
      <h1 id="videoTitle" class="text-base font-bold leading-tight line-clamp-2">Memuat...</h1>
      <div class="flex justify-between items-center mt-1 text-xs text-gray-500 dark:text-gray-400">
        <span id="videoMeta">Memuat data...</span>
        <span class="text-gray-400">▼</span>
      </div>
    </div>

    <!-- Comment Preview (Trigger Comment Modal) -->
    <div onclick="openModal('commentModal')" class="mx-4 mt-2 px-4 py-3 bg-gray-100 dark:bg-[#1a1a1a] rounded-xl cursor-pointer hover:bg-gray-200 dark:hover:bg-[#252525] transition-colors">
      <div class="text-xs font-bold mb-1">Komentar</div>
      <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
        <div class="w-6 h-6 rounded-full bg-gray-300 dark:bg-gray-700"></div>
        <span>Komentar...</span>
      </div>
    </div>

    <!-- Recommendations -->
    <div class="px-4 mt-6">
      <h2 class="text-sm font-bold mb-3">Rekomendasi</h2>
      <div id="recommendationsList" class="flex flex-col gap-3"></div>
    </div>
  </main>

  <!-- MODAL DESKRIPSI -->
  <div id="descModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal('descModal')"></div>
    <div class="absolute bottom-0 w-full h-[80vh] bg-white dark:bg-[#0f0f0f] rounded-t-2xl p-4 overflow-y-auto">
      <div class="w-12 h-1 bg-gray-400 rounded-full mx-auto mb-4"></div>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">Deskripsi</h2>
        <button onclick="closeModal('descModal')" class="font-bold text-xl">✕</button>
      </div>
      
      <!-- Summary Boxes -->
      <div class="grid grid-cols-2 gap-2 mb-4">
        <div class="bg-gray-100 dark:bg-[#272727] p-3 rounded-lg text-center">
          <div id="summaryViews" class="font-bold text-sm">0</div>
          <div class="text-[10px] text-gray-500">Penayangan</div>
        </div>
        <div class="bg-gray-100 dark:bg-[#272727] p-3 rounded-lg text-center">
          <div id="summaryDate" class="font-bold text-sm">-</div>
          <div class="text-[10px] text-gray-500">Tanggal</div>
        </div>
      </div>
      <p id="videoDescription" class="text-sm leading-relaxed whitespace-pre-line"></p>
    </div>
  </div>

  <!-- MODAL KOMENTAR -->
  <div id="commentModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal('commentModal')"></div>
    <div class="absolute bottom-0 w-full h-[90vh] bg-white dark:bg-[#0f0f0f] rounded-t-2xl flex flex-col">
      <div class="p-4 border-b border-gray-200 dark:border-[#222] flex justify-between items-center">
        <h2 class="font-bold">Komentar</h2>
        <button onclick="closeModal('commentModal')" class="text-xl">✕</button>
      </div>
      <div id="commentsList" class="flex-grow overflow-y-auto p-4 space-y-4"></div>
      
      <!-- Input Area -->
      <form id="commentForm" onsubmit="submitComment(event)" class="p-4 border-t border-gray-200 dark:border-[#222] bg-white dark:bg-[#0f0f0f]">
        <div class="flex gap-2">
          <input type="text" id="commentNickname" required class="flex-grow bg-gray-100 dark:bg-[#1a1a1a] rounded-lg px-3 py-2 text-xs" placeholder="Nama">
          <button type="button" onclick="randomizeNickname()" class="px-2 bg-gray-200 dark:bg-[#222] rounded-lg text-xs">🎲</button>
        </div>
        <textarea id="commentContent" rows="2" class="w-full mt-2 bg-gray-100 dark:bg-[#1a1a1a] rounded-lg p-3 text-xs" placeholder="Tulis komentar..."></textarea>
        <button type="submit" id="submitBtn" class="w-full mt-2 py-2 bg-blue-600 text-white font-bold rounded-lg text-xs">Kirim</button>
      </form>
    </div>
  </div>

  <script>
    const CUSDIS_APP_ID = "3b6b52be-1199-4fa2-bfb6-079f492bebe9";
    const urlParams = new URLSearchParams(window.location.search);
    const currentCode = urlParams.get('code');
    let currentVideoData = null;

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Init Logic
    async function init() {
      if(!currentCode) window.location.href = 'index.html';
      const res = await fetch('data.json');
      const videos = await res.json();
      currentVideoData = videos.find(v => v.dood_code === currentCode);
      
      // Update UI
      document.getElementById('videoTitle').innerText = currentVideoData.title;
      document.getElementById('doodPlayer').src = `https://dood.so/e/${currentVideoData.dood_code}`;
      
      const dateStr = currentVideoData.date || "N/A";
      document.getElementById('videoMeta').innerText = "Memuat view...";
      document.getElementById('summaryDate').innerText = dateStr;
      document.getElementById('videoDescription').innerText = currentVideoData.description || "Tidak ada deskripsi.";

      // Load Views
      fetch(`https://api.countapi.xyz/hit/replay_jkt48_catalog_v1/${currentCode}`)
        .then(r => r.json()).then(d => {
          document.getElementById('videoMeta').innerText = `${d.value.toLocaleString()} x ditonton`;
          document.getElementById('summaryViews').innerText = d.value.toLocaleString();
        });

      randomizeNickname();
      renderRecs(videos, currentVideoData);
      fetchComments(currentCode);
    }

    // Comment Logic
    function randomizeNickname() {
      const names = ['Wota', 'Fans', 'Penonton', 'Oshi', 'Wota48'];
      document.getElementById('commentNickname').value = names[Math.floor(Math.random()*names.length)] + '_' + Math.floor(Math.random()*9000);
    }

    async function fetchComments(code) {
      const res = await fetch(`https://cusdis.com/api/open/comments?appId=${CUSDIS_APP_ID}&pageId=${code}`);
      const data = await res.json();
      const list = document.getElementById('commentsList');
      list.innerHTML = data.data.list.map(c => `
        <div class="text-xs">
          <span class="font-bold text-[#896f3d]">${c.nickname}</span>
          <p class="text-gray-300 mt-1">${c.content}</p>
        </div>
      `).join('');
    }

    async function submitComment(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      await fetch('https://cusdis.com/api/open/comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          appId: CUSDIS_APP_ID, pageId: currentCode,
          nickname: document.getElementById('commentNickname').value,
          content: document.getElementById('commentContent').value
        })
      });
      document.getElementById('commentContent').value = '';
      btn.disabled = false;
      fetchComments(currentCode);
    }

    function renderRecs(all, current) {
      const list = document.getElementById('recommendationsList');
      all.filter(v => v.dood_code !== current.dood_code).slice(0,5).forEach(v => {
        const div = document.createElement('div');
        div.className = "flex gap-2 cursor-pointer";
        div.onclick = () => window.location.href = `watch.html?code=${v.dood_code}`;
        div.innerHTML = `<img src="${v.thumb}" class="w-32 aspect-video rounded-lg object-cover">
                         <div class="text-xs font-semibold line-clamp-2">${v.title}</div>`;
        list.appendChild(div);
      });
    }

    init();
  </script>
</body>
</html>
