<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay Match Catalog</title>
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="#" class="text-xl font-bold tracking-wide text-red-500 uppercase flex items-center gap-2">
        <span class="bg-red-600 text-white px-2 py-0.5 rounded text-sm">REPLAY</span> ARENA
      </a>
      
      <!-- Search Bar -->
      <div class="w-full sm:w-72">
        <input type="text" id="searchInput" placeholder="Cari tim atau kompetisi..." 
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-red-500 text-white">
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- Player Section / Area Pemutar Video -->
    <div id="playerSection" class="hidden mb-8 bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <h2 id="activeVideoTitle" class="text-lg font-bold text-white"></h2>
        <button onclick="closePlayer()" class="text-gray-400 hover:text-white font-bold text-sm bg-gray-800 px-3 py-1 rounded">✕ Tutup Player</button>
      </div>
      <div class="relative w-full overflow-hidden rounded-lg bg-black" style="padding-top: 56.25%;">
        <iframe id="doodPlayer" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>

    <!-- Filter Categories / Tabs -->
    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 text-sm no-scrollbar" id="filterContainer">
      <button onclick="filterCategory('All')" class="category-btn active px-4 py-1.5 rounded-full bg-red-600 text-white font-medium whitespace-nowrap">Semua</button>
      <button onclick="filterCategory('Premier League')" class="category-btn px-4 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 whitespace-nowrap">Premier League</button>
      <button onclick="filterCategory('La Liga')" class="category-btn px-4 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 whitespace-nowrap">La Liga</button>
      <button onclick="filterCategory('Serie A')" class="category-btn px-4 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 whitespace-nowrap">Serie A</button>
    </div>

    <!-- Grid Katalog Video -->
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
      <!-- Card items loaded via JS -->
    </div>
  </main>

  <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-xs text-gray-500">
    &copy; 2026 ArenaReplay Clone. Integrated with Doodstream.
  </footer>

  <script>
    let allVideos = [];
    let currentCategory = 'All';

    // Load Data
    async function loadVideos() {
      try {
        const response = await fetch('data.json');
        allVideos = await response.json();
        renderVideos(allVideos);
      } catch (err) {
        console.error("Gagal memuat data video:", err);
      }
    }

    // Render Cards
    function renderVideos(videos) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if(videos.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Video tidak ditemukan.</div>`;
        return;
      }

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-lg overflow-hidden shadow hover:border-gray-700 transition cursor-pointer group flex flex-col";
        card.onclick = () => playVideo(v.title, v.dood_code);

        card.innerHTML = `
          <div class="relative aspect-video bg-gray-800 overflow-hidden">
            <img src="${v.thumb}" alt="${v.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">
              ${v.type}
            </span>
          </div>
          <div class="p-3 flex-grow flex flex-col justify-between">
            <div>
              <span class="text-xs text-gray-400 font-medium">${v.competition}</span>
              <h3 class="text-sm font-semibold text-white group-hover:text-red-400 line-clamp-2 mt-0.5">${v.title}</h3>
            </div>
            <div class="mt-3 text-[11px] text-gray-500 flex justify-between items-center">
              <span>${v.date}</span>
              <span class="text-red-500 font-medium">Tonton &rarr;</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Play Video Function
    function playVideo(title, code) {
      const playerSection = document.getElementById('playerSection');
      const iframe = document.getElementById('doodPlayer');
      const titleEl = document.getElementById('activeVideoTitle');

      titleEl.innerText = title;
      iframe.src = `https://dood.so/e/${code}`;
      playerSection.classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      const playerSection = document.getElementById('playerSection');
      const iframe = document.getElementById('doodPlayer');
      iframe.src = '';
      playerSection.classList.add('hidden');
    }

    // Filter Logic
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if(btn.innerText === cat || (cat === 'All' && btn.innerText === 'Semua')) {
          btn.className = "category-btn active px-4 py-1.5 rounded-full bg-red-600 text-white font-medium whitespace-nowrap";
        } else {
          btn.className = "category-btn px-4 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 whitespace-nowrap";
        }
      });
      applyFilters();
    }

    // Search Logic
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allVideos.filter(v => {
        const matchesCategory = (currentCategory === 'All') || (v.competition === currentCategory);
        const matchesSearch = v.title.toLowerCase().includes(query) || v.competition.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderVideos(filtered);
    }

    loadVideos();
  </script>
</body>
</html>
