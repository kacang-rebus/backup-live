<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay JKT48 Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Inisialisasi tema dari LocalStorage agar tidak reset saat refresh
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark')
    } else {
      document.documentElement.classList.add('dark')
    }
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-white dark:bg-black text-black dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

  <!-- Navbar -->
  <header class="bg-white dark:bg-black border-b border-gray-200 dark:border-[#404751] sticky top-0 z-40 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-4 grid grid-cols-3 items-center">
      <!-- Kiri (kosong) -->
      <div></div>
      
      <!-- Tengah (Judul) -->
      <a href="#" class="text-xl font-bold tracking-wide text-black dark:text-white uppercase flex items-center justify-center gap-2">
        <span class="bg-[#896f3d] text-white px-2 py-0.5 rounded text-sm font-semibold transition-colors duration-300">REPLAY</span> JKT48
      </a>
      
      <!-- Kanan (Toggle Button) -->
      <div class="flex justify-end">
        <button id="themeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
          <!-- Ikon Matahari (Light Mode) -->
          <svg id="sunIcon" class="hidden w-5 h-5 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <!-- Ikon Bulan (Dark Mode) -->
          <svg id="moonIcon" class="block w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- Search Bar -->
    <div class="mb-6">
      <input type="text" id="searchInput" placeholder="Cari video JKT48..." 
             class="w-full bg-white dark:bg-black border border-gray-300 dark:border-[#404751] rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-[#896f3d] text-black dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
    </div>

    <!-- Player Section -->
    <div id="playerSection" class="hidden mb-8 bg-white dark:bg-black border border-gray-300 dark:border-[#404751] rounded-xl p-4 shadow-2xl transition">
      <div class="flex justify-between items-center mb-3">
        <h2 id="activeVideoTitle" class="text-lg font-bold"></h2>
        <button onclick="closePlayer()" class="font-bold text-sm bg-gray-200 dark:bg-black border border-gray-400 dark:border-[#404751] px-3 py-1 rounded transition hover:bg-gray-300 dark:hover:border-[#896f3d]">✕ Tutup</button>
      </div>
      <div class="relative w-full overflow-hidden rounded-lg bg-black" style="padding-top: 56.25%;">
        <iframe id="doodPlayer" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>

    <!-- Filter Categories -->
    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 text-sm no-scrollbar" id="filterContainer">
      <button onclick="filterCategory('All')" class="category-btn active px-4 py-1.5 rounded-full bg-white dark:bg-black text-[#896f3d] font-semibold border border-[#896f3d] shadow-[0_0_8px_rgba(137,111,61,0.5)] whitespace-nowrap transition">Semua</button>
      <button onclick="filterCategory('Show')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Show</button>
      <button onclick="filterCategory('Concert')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Concert</button>
    </div>

    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
  </main>

  <footer class="bg-white dark:bg-black border-t border-gray-200 dark:border-[#404751] py-4 text-center text-xs text-gray-500 dark:text-gray-400 transition">
    &copy; 2026 Replay JKT48. Integrated with Doodstream.
  </footer>

  <script>
    // Logic Toggle Tema & LocalStorage
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function updateIcons() {
      if (document.documentElement.classList.contains('dark')) {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    }

    // Set kondisi awal ikon saat halaman dimuat
    updateIcons();

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        localStorage.theme = 'dark';
      } else {
        localStorage.theme = 'light';
      }
      updateIcons();
    });

    // ... (Fungsi renderVideos, filterCategory, dll tetap sama)
    let allVideos = [];
    let currentCategory = 'All';

    async function loadVideos() {
      try {
        const response = await fetch('data.json');
        allVideos = await response.json();
        renderVideos(allVideos);
      } catch (err) { console.error("Gagal memuat:", err); }
    }

    function renderVideos(videos) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-black border border-gray-300 dark:border-[#404751] rounded-lg overflow-hidden shadow-lg hover:border-[#896f3d] transition duration-300 cursor-pointer group flex flex-col";
        card.onclick = () => playVideo(v.title, v.dood_code);
        card.innerHTML = `
          <div class="relative aspect-video bg-gray-200 dark:bg-black overflow-hidden">
            <img src="${v.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition">
            <span class="absolute top-2 left-2 bg-[#896f3d] text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">${v.type}</span>
          </div>
          <div class="p-3 flex-grow">
            <span class="text-xs text-gray-500 dark:text-gray-400">${v.category}</span>
            <h3 class="text-sm font-semibold text-black dark:text-white group-hover:text-[#896f3d] line-clamp-2 mt-0.5">${v.title}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function playVideo(title, code) {
      document.getElementById('activeVideoTitle').innerText = title;
      document.getElementById('doodPlayer').src = `https://dood.so/e/${code}`;
      document.getElementById('playerSection').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      document.getElementById('doodPlayer').src = '';
      document.getElementById('playerSection').classList.add('hidden');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if(btn.innerText === cat || (cat === 'All' && btn.innerText === 'Semua')) {
          btn.className = "category-btn active px-4 py-1.5 rounded-full bg-white dark:bg-black text-[#896f3d] font-semibold border border-[#896f3d] shadow-[0_0_8px_rgba(137,111,61,0.5)] whitespace-nowrap transition";
        } else {
          btn.className = "category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition";
        }
      });
      applyFilters();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allVideos.filter(v => 
        (currentCategory === 'All' || v.category === currentCategory) && 
        (v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query))
      );
      renderVideos(filtered);
    }

    loadVideos();
  </script>
</body>
</html>
