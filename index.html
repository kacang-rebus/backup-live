<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay JKT48 Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark')
    } else {
      document.documentElement.classList.add('dark')
    }
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-white dark:bg-black text-black dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

  <!-- Navbar -->
  <header class="bg-white dark:bg-black border-b border-gray-200 dark:border-[#404751] sticky top-0 z-40 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-4 grid grid-cols-3 items-center">
      <div class="flex items-center">
        <!-- Hamburger Button -->
        <button id="menuToggle" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition" aria-label="Buka Menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
      
      <!-- Judul Tengah -->
      <a href="#" class="text-xl font-bold tracking-wide text-black dark:text-white uppercase flex items-center justify-center gap-2">
        <span class="bg-[#896f3d] text-white dark:text-black px-2 py-0.5 rounded text-sm font-semibold transition-colors duration-300">REPLAY</span> JKT48
      </a>
      
      <!-- Theme Toggle -->
      <div class="flex justify-end">
        <button id="themeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition" aria-label="Ganti Tema">
          <svg id="sunIcon" class="hidden w-5 h-5 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="moonIcon" class="block w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Overlay & Drawer -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-white dark:bg-black border-r border-gray-300 dark:border-[#404751] z-50 transform -translate-x-full transition-transform duration-300 ease-in-out p-4 pt-16 flex flex-col">
    <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-200 dark:border-gray-800">
      <h3 class="font-bold text-base flex items-center gap-2"><span>📅</span> Filter Judul (Bulan)</h3>
      <button onclick="resetArchiveFilter()" id="resetArchiveBtn" class="hidden text-xs text-[#896f3d] font-semibold hover:underline">Reset</button>
    </div>
    <div id="activeArchiveLabel" class="text-xs text-[#896f3d] font-medium mb-2 hidden"></div>
    <div id="sidebarAccordion" class="space-y-1 text-sm overflow-y-auto flex-grow pr-1"></div>
  </aside>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- Search Bar -->
    <div class="mb-6">
      <input type="text" id="searchInput" placeholder="Cari kata kunci dalam judul..." 
             class="w-full bg-white dark:bg-black border border-gray-300 dark:border-[#404751] rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-[#896f3d] text-black dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
    </div>

    <!-- Filter Category Horizontal Bar -->
    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 text-sm no-scrollbar" id="filterContainer">
      <button onclick="filterCategory('All')" class="category-btn active px-4 py-1.5 rounded-full bg-white dark:bg-black text-[#896f3d] font-semibold border border-[#896f3d] shadow-[0_0_8px_rgba(137,111,61,0.5)] whitespace-nowrap transition">Semua</button>
      <button onclick="filterCategory('Special Show / Concert')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Special Show / Concert</button>
      <button onclick="filterCategory('Passion 200%')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Passion 200%</button>
      <button onclick="filterCategory('Dream Bakudan')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Dream Bakudan</button>
      <button onclick="filterCategory('ITADAKI♡LOVE')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">ITADAKI♡LOVE</button>
      <button onclick="filterCategory('Pertaruhan Cinta')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Pertaruhan Cinta</button>
      <button onclick="filterCategory('Cara Meminum Ramune')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Cara Meminum Ramune</button>
      <button onclick="filterCategory('TWT')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">TWT</button>
      <button onclick="filterCategory('Pajama Drive')" class="category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition">Pajama Drive</button>
    </div>

    <!-- Video Player Section -->
    <div id="playerSection" class="hidden mb-8 bg-white dark:bg-black border border-gray-300 dark:border-[#404751] rounded-xl p-4 shadow-2xl transition">
      <div class="flex justify-between items-center mb-3">
        <h2 id="activeVideoTitle" class="text-lg font-bold"></h2>
        <button onclick="closePlayer()" class="font-bold text-sm bg-gray-200 dark:bg-black border border-gray-400 dark:border-[#404751] px-3 py-1 rounded transition hover:bg-gray-300 dark:hover:border-[#896f3d]">✕ Tutup</button>
      </div>
      <div class="relative w-full overflow-hidden rounded-lg bg-black" style="padding-top: 56.25%;">
        <iframe id="doodPlayer" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
  </main>

  <footer class="bg-white dark:bg-black border-t border-gray-200 dark:border-[#404751] py-4 text-center text-xs text-gray-500 dark:text-gray-400 transition">
    &copy; 2026 Replay JKT48. Integrated with Doodstream.
  </footer>

  <script>
    // Konfigurasi Bulan & Tahun yang bisa difilter di judul
    const archiveConfig = [
      {
        year: "2026",
        months: ["Juni", "Juli", "Agustus"]
      }
    ];

    // --- LOGIKA DRAWER SIDEBAR ---
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    function toggleSidebar() {
      const isOpen = sidebar.classList.contains('translate-x-0');
      if (isOpen) {
        sidebar.classList.remove('translate-x-0');
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      } else {
        sidebar.classList.add('translate-x-0');
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      }
    }

    menuToggle.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    // --- LOGIKA TEMA DARK / LIGHT ---
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function updateIcons() {
      if (document.documentElement.classList.contains('dark')) {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    }
    updateIcons();

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      updateIcons();
    });

    // --- STATE DATA & FILTER ---
    let allVideos = [];
    let currentCategory = 'All';
    let selectedYear = 'All';
    let selectedMonth = 'All';

    function renderSidebar() {
      const accordion = document.getElementById('sidebarAccordion');
      accordion.innerHTML = '';

      archiveConfig.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = "border-b border-gray-200 dark:border-gray-800 py-1";
        itemEl.innerHTML = `
          <button onclick="toggleYearAccordion('${item.year}')" class="w-full flex items-center justify-between py-2 font-semibold hover:text-[#896f3d] transition">
            <span>Tahun ${item.year}</span>
            <span id="arrow-${item.year}" class="text-xs transition-transform duration-200">▶</span>
          </button>
          <div id="months-${item.year}" class="hidden pl-3 space-y-1 pb-2">
            <button onclick="filterArchive('${item.year}', 'All')" class="block w-full text-left text-xs py-1.5 text-gray-500 dark:text-gray-400 hover:text-[#896f3d] italic">Semua Video ${item.year}</button>
            ${item.months.map(m => `
              <button onclick="filterArchive('${item.year}', '${m}')" class="block w-full text-left text-xs py-1.5 text-gray-700 dark:text-gray-300 hover:text-[#896f3d] font-medium">
                • Kata "${m}"
              </button>
            `).join('')}
          </div>
        `;
        accordion.appendChild(itemEl);
      });
    }

    function toggleYearAccordion(year) {
      const monthDiv = document.getElementById(`months-${year}`);
      const arrow = document.getElementById(`arrow-${year}`);
      if (monthDiv.classList.contains('hidden')) {
        monthDiv.classList.remove('hidden');
        arrow.style.transform = 'rotate(90deg)';
      } else {
        monthDiv.classList.add('hidden');
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    function filterArchive(year, month) {
      selectedYear = year;
      selectedMonth = month;
      
      const label = document.getElementById('activeArchiveLabel');
      const resetBtn = document.getElementById('resetArchiveBtn');
      
      label.classList.remove('hidden');
      resetBtn.classList.remove('hidden');

      if (month === 'All') {
        label.innerText = `Cari Judul dengan Tahun: ${year}`;
      } else {
        label.innerText = `Cari Judul dengan Bulan: ${month} ${year !== 'All' ? year : ''}`;
      }

      toggleSidebar(); // Tutup sidebar setelah memilih
      applyFilters();
    }

    function resetArchiveFilter() {
      selectedYear = 'All';
      selectedMonth = 'All';
      document.getElementById('activeArchiveLabel').classList.add('hidden');
      document.getElementById('resetArchiveBtn').classList.add('hidden');
      applyFilters();
    }

    async function loadVideos() {
      try {
        const response = await fetch('data.json');
        allVideos = await response.json();
        renderVideos(allVideos);
      } catch (err) { console.error("Gagal memuat video:", err); }
    }

        function renderVideos(videos) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (videos.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Tidak ada video yang ditemukan.</div>`;
        return;
      }

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-black border border-gray-300 dark:border-[#404751] rounded-lg overflow-hidden shadow-lg hover:border-[#896f3d] transition duration-300 cursor-pointer group flex flex-col";
        
        // UBAH BARIS INI: Pindah ke watch.html membawa parameter dood_code
        card.onclick = () => {
          window.location.href = `watch.html?code=${v.dood_code}`;
        };

        card.innerHTML = `
          <div class="relative aspect-video bg-gray-200 dark:bg-black overflow-hidden">
            <img src="${v.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition">
            <span class="absolute top-2 left-2 bg-[#896f3d] text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">${v.type || 'REPLAY'}</span>
          </div>
          <div class="p-3 flex-grow">
            <span class="text-xs text-gray-500 dark:text-gray-400 block mb-1">${v.category}</span>
            <h3 class="text-sm font-semibold text-black dark:text-white group-hover:text-[#896f3d] line-clamp-2">${v.title}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }


    function playVideo(title, code) {
      document.getElementById('activeVideoTitle').innerText = title;
      document.getElementById('doodPlayer').src = `https://dood.so/e/${code}`;
      document.getElementById('playerSection').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      document.getElementById('doodPlayer').src = '';
      document.getElementById('playerSection').classList.add('hidden');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if(btn.innerText === cat || (cat === 'All' && btn.innerText === 'Semua')) {
          btn.className = "category-btn active px-4 py-1.5 rounded-full bg-white dark:bg-black text-[#896f3d] font-semibold border border-[#896f3d] shadow-[0_0_8px_rgba(137,111,61,0.5)] whitespace-nowrap transition";
        } else {
          btn.className = "category-btn px-4 py-1.5 rounded-full bg-white dark:bg-black text-black dark:text-white font-medium border border-gray-400 dark:border-[#404751] hover:border-[#896f3d] hover:text-[#896f3d] whitespace-nowrap transition";
        }
      });
      applyFilters();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // --- LOGIKA FILTER UTAMA ---
    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allVideos.filter(v => {
        const titleLower = (v.title || '').toLowerCase();

        // 1. Filter Kategori Bar Atas
        let matchesCategory = false;
        if (currentCategory === 'All') matchesCategory = true;
        else if (currentCategory === 'Special Show / Concert') matchesCategory = (v.category === 'Show' || v.category === 'Concert');
        else matchesCategory = (v.category === currentCategory);

        // 2. Filter Judul berdasarkan kata Bulan & Tahun dari Sidebar
        let matchesMonth = (selectedMonth === 'All') || titleLower.includes(selectedMonth.toLowerCase());
        let matchesYear = (selectedYear === 'All') || titleLower.includes(selectedYear.toLowerCase());

        // 3. Search Bar Input
        let matchesSearch = titleLower.includes(query) || (v.category && v.category.toLowerCase().includes(query));

        return matchesCategory && matchesMonth && matchesYear && matchesSearch;
      });

      renderVideos(filtered);
    }

    // Inisialisasi awal
    renderSidebar();
    loadVideos();
  </script>
</body>
</html>
