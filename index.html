<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay JKT48 Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Inisialisasi Tema
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark')
    } else {
      document.documentElement.classList.add('dark')
    }
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-white dark:bg-black text-black dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

  <!-- Header -->
  <header class="bg-white dark:bg-black border-b border-gray-200 dark:border-[#404751] sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <button id="menuToggle" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      
      <a href="#" class="text-xl font-bold tracking-wide uppercase flex items-center gap-2">
        <span class="bg-[#896f3d] text-white px-2 py-0.5 rounded text-sm font-semibold">REPLAY</span> JKT48
      </a>

      <button id="themeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800">
        <span id="themeIcon">🌓</span>
      </button>
    </div>
  </header>

  <!-- Sidebar Drawer -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-white dark:bg-black border-r border-gray-300 dark:border-[#404751] z-50 transform -translate-x-full transition-transform duration-300 p-4 pt-16 flex flex-col">
    <h3 class="font-bold text-base mb-4 border-b border-gray-800 pb-2">Filter Arsip</h3>
    <div id="sidebarAccordion" class="overflow-y-auto"></div>
  </aside>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 w-full">
    <input type="text" id="searchInput" placeholder="Cari judul..." class="w-full bg-white dark:bg-black border border-gray-600 rounded-lg px-4 py-2 mb-6 focus:outline-none focus:border-[#896f3d]">

    <!-- Kategori (Container ini harus relative z-10) -->
    <div class="relative z-10 flex items-center gap-2 overflow-x-auto pb-4 mb-6" id="filterContainer">
      <button data-cat="All" class="category-btn active px-4 py-1.5 rounded-full bg-[#896f3d] text-white font-semibold">Semua</button>
      <button data-cat="Special Show / Concert" class="category-btn px-4 py-1.5 rounded-full border border-gray-500 hover:border-[#896f3d]">Special Show / Concert</button>
      <button data-cat="Passion 200%" class="category-btn px-4 py-1.5 rounded-full border border-gray-500 hover:border-[#896f3d]">Passion 200%</button>
      <button data-cat="Dream Bakudan" class="category-btn px-4 py-1.5 rounded-full border border-gray-500 hover:border-[#896f3d]">Dream Bakudan</button>
    </div>

    <div id="playerSection" class="hidden mb-8 bg-black p-4 rounded-xl">
      <button onclick="closePlayer()" class="text-white mb-2 underline">✕ Tutup</button>
      <div class="relative w-full pt-[56.25%]">
        <iframe id="doodPlayer" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>

    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
  </main>

  <script>
    // Konfigurasi
    const archiveConfig = [{ year: "2026", months: ["Juni", "Juli", "Agustus"] }];
    let allVideos = [];
    let currentCategory = 'All';
    let selectedYear = 'All';
    let selectedMonth = 'All';

    // Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle Sidebar
      document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
      document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
      
      // Tombol Kategori
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const cat = e.target.getAttribute('data-cat');
          filterCategory(cat);
        });
      });

      // Search
      document.getElementById('searchInput').addEventListener('input', applyFilters);

      renderSidebar();
      loadVideos();
    });

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const isOpen = !sidebar.classList.contains('-translate-x-full');
      
      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      } else {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if(btn.getAttribute('data-cat') === cat) {
          btn.classList.add('bg-[#896f3d]', 'text-white');
          btn.classList.remove('border', 'border-gray-500');
        } else {
          btn.classList.remove('bg-[#896f3d]', 'text-white');
          btn.classList.add('border', 'border-gray-500');
        }
      });
      applyFilters();
    }

    function renderSidebar() {
      const accordion = document.getElementById('sidebarAccordion');
      archiveConfig.forEach(item => {
        const div = document.createElement('div');
        div.innerHTML = `
          <div class="py-2 font-bold">Tahun ${item.year}</div>
          ${item.months.map(m => `
            <button class="block w-full text-left py-1 pl-4 hover:text-[#896f3d]" onclick="filterArchive('${item.year}', '${m}')">• ${m}</button>
          `).join('')}
        `;
        accordion.appendChild(div);
      });
    }

    function filterArchive(year, month) {
      selectedYear = year;
      selectedMonth = month;
      toggleSidebar();
      applyFilters();
    }

    async function loadVideos() {
      try {
        const response = await fetch('data.json');
        allVideos = await response.json();
        applyFilters();
      } catch (e) { console.error("Error load data.json:", e); }
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allVideos.filter(v => {
        const title = v.title.toLowerCase();
        const cat = v.category.toLowerCase();
        
        const matchCat = (currentCategory === 'All' || cat.includes(currentCategory.toLowerCase()));
        const matchSearch = title.includes(query);
        const matchMonth = (selectedMonth === 'All' || title.includes(selectedMonth.toLowerCase()));
        
        return matchCat && matchSearch && matchMonth;
      });
      
      renderVideos(filtered);
    }

    function renderVideos(videos) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = videos.map(v => `
        <div class="p-4 border border-gray-700 rounded-lg cursor-pointer" onclick="playVideo('${v.dood_code}')">
          <h3 class="font-bold">${v.title}</h3>
          <p class="text-xs text-gray-400">${v.category}</p>
        </div>
      `).join('');
    }

    function playVideo(code) {
      document.getElementById('doodPlayer').src = `https://dood.so/e/${code}`;
      document.getElementById('playerSection').classList.remove('hidden');
    }

    function closePlayer() {
      document.getElementById('doodPlayer').src = '';
      document.getElementById('playerSection').classList.add('hidden');
    }
  </script>
</body>
</html>
